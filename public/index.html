<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ClearView Opticals</title><link rel="icon" type="image/svg+xml" href="/logo.svg"><link rel="apple-touch-icon" href="/logo.png"><meta name="theme-color" content="#0f766e">
<style>

main{max-width:1100px;margin:0 auto;padding:16px}

label{display:block;margin:10px 0 4px;font-weight:600}
.b{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--on);font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}

.tw{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}

.sw{display:flex;gap:7px;margin:6px 0;flex-wrap:wrap}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}.dot.on{outline:2px solid var(--ac);outline-offset:2px}
.star{color:#f59e0b;letter-spacing:1px}.rv{border-top:1px solid var(--bd);padding:10px 0}.rv img{max-width:140px;border-radius:8px;display:block;margin-top:6px}

/* ---- animations ---- */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}

header{animation:down .5s ease backwards}

.hc{flex:1;min-width:0;padding-bottom:26px}
.chars{position:relative;display:flex;align-items:flex-end;flex:none;padding-top:50px}
.ch{width:112px;height:auto;overflow:visible}

.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ahoge{transform-origin:60px 28px;animation:sway 2.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.wv{transform-origin:86px 132px;animation:wave 1.2s ease-in-out infinite}

.shd{animation:shd 6s ease-in-out infinite}
@keyframes shd{0%,45%{transform:translateY(-27px)}55%,92%{transform:none}100%{transform:translateY(-27px)}}
.say{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;color:#1d2330;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:600;white-space:nowrap;animation:pop .35s}
.say::after{content:"";position:absolute;left:28%;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.sp{position:absolute;font-style:normal;color:#fde68a;animation:tw 2.2s ease-in-out infinite;pointer-events:none}.s1{left:46%;top:14%;font-size:18px}.s2{right:32%;top:58%;font-size:12px;animation-delay:-1s}.s3{left:6%;bottom:14%;font-size:14px;animation-delay:-.5s}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(30deg)}}
.cheer{text-align:center}.cheer .ch{width:110px;animation:jmp .7s ease-in-out infinite alternate}
@keyframes jmp{to{transform:translateY(-12px)}}
@media(max-width:560px){.hero{flex-direction:column;align-items:flex-start}.chars{align-self:flex-end}.ch{width:84px}.chars{padding-top:44px}.hc{padding-bottom:0}.say{font-size:12px}}
.hero h1,.hero p{position:relative;z-index:1}

.card.in{animation:up .5s ease backwards;animation-delay:calc(var(--i,0)*55ms)}
.img svg,.img img{transition:transform .35s ease}.card:hover .img svg,.card:hover .img img{transform:scale(1.08) rotate(-2deg)}
.b{transition:transform .15s,box-shadow .15s,filter .15s}.b:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0003;filter:brightness(1.08)}.b:active{transform:scale(.95)}
.chip{transition:transform .2s,background .2s}.chip:hover{transform:translateY(-2px)}
.dot{transition:transform .15s}.dot:hover{transform:scale(1.2)}
.logo{display:inline-flex;align-items:center;line-height:0}.lg{height:44px;width:auto;overflow:visible;transition:transform .3s}.logo:hover .lg{transform:rotate(-8deg) scale(1.07)}.flogo{margin-bottom:8px}.flogo .lg{height:38px}
.lg .lr,.lg .lv{stroke-dasharray:100;animation:dr 1s ease backwards}.lg .lv{animation-duration:.6s;animation-delay:.7s}
.lg .ld{transform-origin:300px 300px;animation:lp .6s .3s cubic-bezier(.2,.9,.3,1.3) backwards}
.lg .ls{transform-origin:520px 300px;animation:tw 2.4s ease-in-out infinite}
@keyframes dr{from{stroke-dashoffset:100}}@keyframes lp{from{transform:scale(0)}}
.ov:not([hidden]){animation:fade .2s ease}.md{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.fab:not([hidden]){animation:ring 2.4s infinite}.fab:hover{animation:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
footer{text-align:center;padding:24px;color:var(--mut)}footer a{color:var(--mut)}
</style></head><body>

<script>
const CATS=["All","Eyeglasses","Sunglasses","Computer","Kids"];
let PR=[],S=null,SET={upi:"",qr:"",support:[]},SEL={},RV={},pvid=0,rvImg,CL=[],RVW=[],ORD=[],cart=[],cat="All",q="",sort="",tab="p",nx=0,eid=0,qrTmp="",imgTmp;
const $=s=>document.querySelector(s),inr=n=>"₹"+Number(n).toLocaleString("en-IN"),P=id=>PR.find(p=>p.id==id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(m,u,b){const r=await fetch("/api"+u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong");return j}

const cls=()=>{$("#m").hidden=true},err=m=>{const e=$("#er");if(e)e.textContent=m};

const stars=r=>"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r)),ci=p=>Math.min(SEL[p.id]||0,p.colors.length-1),col=p=>p.colors[ci(p)],dg=n=>String(n).replace(/\D/g,""),wa=n=>{const d=dg(n);return d.length==10?"91"+d:d};
const GIRL=`<svg class="ch" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg"><g class="bob"><path d="M18 74Q14 18 60 16Q106 18 102 74L108 128Q94 138 90 112L30 112Q26 138 12 128Z" fill="#4c1d95"/><path d="M32 170Q34 124 60 120Q86 124 88 170Z" fill="#f472b6"/><path d="M48 120L60 134L72 120Z" fill="#fff"/><rect x="53" y="104" width="14" height="18" rx="6" fill="#fcd9bd"/><g class="wv"><path d="M86 132Q100 120 102 100" stroke="#f472b6" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="102" cy="95" r="7" fill="#ffe4d1"/></g><ellipse cx="60" cy="70" rx="35" ry="33" fill="#ffe4d1"/><path d="M24 70Q26 26 60 24Q94 26 96 70Q84 46 68 54Q58 38 44 56Q32 52 24 70Z" fill="#5b21b6"/><path d="M40 34Q52 28 64 32" stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round"/><g class="ahoge"><path d="M58 26Q54 8 70 5Q63 14 66 26Z" fill="#5b21b6"/></g><g class="eye"><ellipse cx="44" cy="74" rx="8" ry="10" fill="#fff"/><ellipse cx="45" cy="76" rx="6" ry="8" fill="#0ea5e9"/><ellipse cx="45" cy="77" rx="3" ry="5" fill="#0c4a6e"/><circle cx="43" cy="72" r="2.4" fill="#fff"/></g><g class="eye"><ellipse cx="76" cy="74" rx="8" ry="10" fill="#fff"/><ellipse cx="75" cy="76" rx="6" ry="8" fill="#0ea5e9"/><ellipse cx="75" cy="77" rx="3" ry="5" fill="#0c4a6e"/><circle cx="73" cy="72" r="2.4" fill="#fff"/></g><ellipse cx="33" cy="87" rx="6" ry="3.5" fill="#fb7185" opacity=".45"/><ellipse cx="87" cy="87" rx="6" ry="3.5" fill="#fb7185" opacity=".45"/><path d="M55 90Q60 96 65 90" stroke="#be185d" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="44" cy="74" r="14" fill="#bae6fd" fill-opacity=".25" stroke="#1f2937" stroke-width="3"/><circle cx="76" cy="74" r="14" fill="#bae6fd" fill-opacity=".25" stroke="#1f2937" stroke-width="3"/><path d="M58 73Q60 70 62 73" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M26 74Q22 100 30 112M94 74Q98 100 90 112" stroke="#4c1d95" stroke-width="7" fill="none" stroke-linecap="round"/></g></svg>`,
BOY=`<svg class="ch" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg"><g class="bob"><path d="M22 70L16 38L36 48L38 20L54 40L66 16L76 40L92 22L92 46L106 36L98 72Z" fill="#1e3a8a"/><path d="M30 170Q32 124 60 120Q88 124 90 170Z" fill="#fb923c"/><path d="M46 120Q60 136 74 120" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="53" y="104" width="14" height="18" rx="6" fill="#fcd9bd"/><ellipse cx="60" cy="72" rx="34" ry="32" fill="#ffe4d1"/><path d="M26 66Q30 38 60 36Q90 38 94 66Q84 52 74 58L66 46L56 58L46 46Q34 52 26 66Z" fill="#2563eb"/><g class="eye"><ellipse cx="46" cy="76" rx="7" ry="9" fill="#fff"/><ellipse cx="47" cy="78" rx="5" ry="7" fill="#22c55e"/><ellipse cx="47" cy="79" rx="2.6" ry="4.4" fill="#14532d"/><circle cx="45" cy="74" r="2.2" fill="#fff"/></g><g class="eye"><ellipse cx="74" cy="76" rx="7" ry="9" fill="#fff"/><ellipse cx="73" cy="78" rx="5" ry="7" fill="#22c55e"/><ellipse cx="73" cy="79" rx="2.6" ry="4.4" fill="#14532d"/><circle cx="71" cy="74" r="2.2" fill="#fff"/></g><ellipse cx="36" cy="88" rx="5" ry="3" fill="#fb7185" opacity=".4"/><ellipse cx="84" cy="88" rx="5" ry="3" fill="#fb7185" opacity=".4"/><path d="M52 91Q62 99 70 90" stroke="#9a3412" stroke-width="2" fill="none" stroke-linecap="round"/><g class="shd"><rect x="26" y="66" width="31" height="20" rx="8" fill="#111827"/><rect x="63" y="66" width="31" height="20" rx="8" fill="#111827"/><rect x="55" y="70" width="10" height="4" fill="#111827"/><path d="M32 71L42 69" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/><path d="M69 71L79 69" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/></g></g></svg>`;
const MSG=["Hi! Find your perfect frames ✨","Free home delivery 🚚","Pay by UPI or cash 💳","Pick your favourite colour 🎨","Tap 📞 if you need help!"];let mi=0;
setInterval(()=>{const b=$("#say");if(!b)return;mi=(mi+1)%MSG.length;b.textContent=MSG[mi];b.style.animation="none";void b.offsetWidth;b.style.animation=""},3500);
const sws=p=>p.colors.length>1?`<div class="sw">${p.colors.map((c,i)=>`<button class="dot${i==ci(p)?" on":""}" style="background:${esc(c.h)}" title="${esc(c.n)}" aria-label="${esc(c.n)}" data-a="sc" data-i="${p.id}:${i}"></button>`).join("")}</div>`:"";
const pic=(p,hx)=>p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" style="width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:8px;display:block">`:glass(p,hx);
function shrink(f,cb){const im=new Image,u=URL.createObjectURL(f);
im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
let d,qy=.85;do{d=c.toDataURL("image/jpeg",qy);qy-=.15}while(d.length>280000&&qy>.2);if(d.length>280000)return toast("Photo is too large, try a smaller one");
cb(d)};
im.onerror=()=>toast("Could not read that image");im.src=u}

return `<svg viewBox="0 0 200 100" width="100%" role="img" aria-label="${esc(p.name)}"><g fill="${sun?"#222":"#8ec5d6"}" fill-opacity="${sun?.85:.35}" stroke="${esc(c)}" stroke-width="5">${sh}</g><path d="M86 46Q100 38 114 46" fill="none" stroke="${esc(c)}" stroke-width="5"/><path d="M32 44L8 36M168 44L192 36" stroke="${esc(c)}" stroke-width="5" stroke-linecap="round"/></svg>`}
async function init(){try{const m=await api("GET","/me");S=m.role?m:null;await load()}catch(e){toast("Cannot reach the server")}render()}
function nav(){$("#fab").hidden=!(SET.support&&SET.support.length);const u=S&&S.role=="user",a=S&&S.role=="admin";
$("#nav").innerHTML=`${a?'<a href="#admin" class="b g">Admin panel</a>':""}${u?'<a href="#orders" class="b g">My orders</a>':""}<button class="b g" data-a="cartv">🛒 ${cart.reduce((s,c)=>s+c.q,0)}</button>${S?'<button class="b" data-a="out">Logout</button>':'<button class="b" data-a="login">Login</button>'}`}
function render(){cls();nav();const h=location.hash.slice(1);
if(h=="admin"){if(S&&S.role=="admin")return admin().catch(e=>{S=null;nav();shop();adminLogin()});shop();adminLogin();return}

function shop(){$("#main").innerHTML=`<section class="hero"><div class="hc"><h1>Find frames that fit your face and your life</h1><p>Eyeglasses, sunglasses, computer and kids’ glasses. Pay by cash on delivery or online (UPI / QR).</p></div><div class="chars" aria-hidden="true"><div class="say" id="say">Hi! Find your perfect frames ✨</div>${GIRL}${BOY}</div><i class="sp s1">✦</i><i class="sp s2">✦</i><i class="sp s3">✦</i></section><div class="chips">${CATS.map(c=>`<button class="chip${c==cat?" on":""}" data-a="cat" data-i="${c}">${c}</button>`).join("")}<select id="so" aria-label="Sort"><option value="">Sort: Featured</option><option value="lo"${sort=="lo"?" selected":""}>Price: low to high</option><option value="hi"${sort=="hi"?" selected":""}>Price: high to low</option></select></div><div class="grid" id="grid"></div>`;
$("#so").onchange=e=>{sort=e.target.value;grid()};grid()}
function grid(){const g=$("#grid");if(!g)return;let l=PR.filter(p=>(cat=="All"||p.cat==cat)&&(p.name+" "+p.desc).toLowerCase().includes(q.toLowerCase()));

const key=cat+"|"+q,fresh=g.dataset.k!==key;g.dataset.k=key;g.innerHTML=l.map((p,k)=>`<div class="card${fresh?" in":""}" style="--i:${Math.min(k,12)}"><div class="img" data-a="pv" data-i="${p.id}" style="cursor:pointer">${pic(p,col(p).h)}</div><div class="pad"><small>${esc(p.cat)}</small><h3><a href="#" data-a="pv" data-i="${p.id}" style="color:inherit;text-decoration:none">${esc(p.name)}</a></h3>${sws(p)}<div class="mut">${p.rc?`<span class="star">${stars(p.rating)}</span> ${p.rating} (${p.rc})`:"No reviews yet"}</div><p class="mut">${esc(p.desc)}</p><div class="row"><b>${inr(p.price)}</b>${p.stock>0?`<button class="b" data-a="add" data-i="${p.id}">Add to cart</button>`:'<span class="mut">Out of stock</span>'}</div></div></div>`).join("")||"<p>No glasses found.</p>"}
$("#q").oninput=e=>{q=e.target.value;if(!location.hash||location.hash=="#shop")grid()};
function cartM(){cart=cart.filter(c=>P(c.id));const t=cart.reduce((s,c)=>s+c.q*P(c.id).price,0);
modal(`<h2>Your cart</h2>${cart.length?cart.map((c,k)=>{const p=P(c.id);return `<div class="row"><span>${esc(p.name)}${p.colors.length>1?` (${esc(c.c)})`:""}<br><small>${inr(p.price)}</small></span><span><button class="b g" data-a="dec" data-i="${k}">−</button> ${c.q} <button class="b g" data-a="inc" data-i="${k}">+</button></span></div>`}).join("")+`<div class="row"><b>Total</b><b>${inr(t)}</b></div><button class="b x" data-a="co">Checkout</button>`:"<p>Your cart is empty.</p>"}<button class="b g x" data-a="x">Close</button>`)}
function loginM(mode){const up=mode=="up";modal(`<h2>${up?"Create account":"Welcome back"}</h2>${up?'<label>Full name</label><input id="ln" autocomplete="name">':""}<label>Mobile number</label><input id="lm" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel"><label>Password</label><input id="lp" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="At least 6 characters"><p id="er" class="err"></p><button class="b x" data-a="${up?"su":"si"}">${up?"Sign up":"Login"}</button><p class="mut">${up?"Have an account?":"New here?"} <a href="#" data-a="${up?"li":"lu"}">${up?"Login":"Create account"}</a></p>`)}
function adminLogin(){modal(`<h2>Admin login</h2><label>Username</label><input id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><p id="er" class="err"></p><button class="b x" data-a="al">Login</button><button class="b g x" data-a="x">Cancel</button>`)}
function checkout(){const t=cart.reduce((s,c)=>s+c.q*P(c.id).price,0);
modal(`<h2>Checkout</h2><label>Name</label><input id="cn" value="${esc(S.name||"")}"><label>Delivery address</label><textarea id="ca" rows="3" placeholder="House no, street, city"></textarea><label>PIN code</label><input id="cp" inputmode="numeric" maxlength="6"><label>Payment</label><label class="po"><input type="radio" name="py" value="COD" checked> Cash on delivery</label><label class="po"><input type="radio" name="py" value="Online"> Online payment (UPI / scan QR)</label><div id="pi"></div><p id="er" class="err"></p><div class="row"><b>Total ${inr(t)}</b><button class="b" data-a="pl">Place order</button></div>`);

function payInfo(){const v=document.querySelector("[name=py]:checked").value,t=cart.reduce((a,c)=>a+c.q*P(c.id).price,0);$("#pi").innerHTML=v=="COD"?'<p class="mut">Pay in cash when your glasses arrive.</p>':(SET.qr?`<div style="text-align:center"><p>Scan this QR with any UPI app and pay <b>${inr(t)}</b></p><img src="${esc(SET.qr)}" alt="Payment QR" style="max-width:220px;width:100%">${SET.upi?`<p>UPI ID: <b>${esc(SET.upi)}</b></p><a class="b" href="upi://pay?pa=${encodeURIComponent(SET.upi)}&pn=ClearView%20Opticals&am=${t}&cu=INR">Pay with UPI app</a>`:""}</div><label>UPI transaction ID (after paying)</label><input id="tx" placeholder="Transaction / UTR number">`:'<p class="mut">Online payment is not available right now. Please choose Cash on delivery.</p>')}
async function orders(){const l=await api("GET","/orders/mine");$("#main").innerHTML=`<h2>My orders</h2>${l.map(o=>`<div class="card" style="margin-bottom:12px"><div class="pad"><div class="row"><b>#${o.id}</b><span class="tag">${esc(o.status)}</span></div><small>${new Date(o.created).toLocaleString("en-IN")} · ${esc(o.payment)}</small><p>${o.items.map(i=>esc(i.n)+(i.c?" ("+esc(i.c)+")":"")+" × "+i.q).join(", ")}</p><b>${inr(o.total)}</b>${o.status=="Delivered"?`<p>${o.items.map(i=>{const pr=i.id?P(i.id):PR.find(x=>x.name==i.n);return pr?`<button class="b g" data-a="pv" data-i="${pr.id}">⭐ Review ${esc(i.n)}</button> `:""}).join("")}</p>`:""}</div></div>`).join("")||"<p>No orders yet. Go and pick a frame!</p>"}`}
async function admin(){const st=await api("GET","/admin/stats");if(tab=="o")ORD=await api("GET","/admin/orders");if(tab=="r")RVW=await api("GET","/admin/reviews");
$("#main").innerHTML=`<h2>Admin panel</h2><div class="stats">${[["Products",st.products],["Orders",st.orders],["Customers",st.customers],["Sales",inr(st.sales)]].map(([l,v])=>`<div class="card"><div class="pad"><small>${l}</small><h3>${v}</h3></div></div>`).join("")}</div><div class="chips">${[["p","Products"],["o","Orders"],["r","Reviews"],["s","Settings"]].map(([k,l])=>`<button class="chip${tab==k?" on":""}" data-a="tab" data-i="${k}">${l}</button>`).join("")}</div><div id="ad"></div>`;
const ad=$("#ad");
if(tab=="p")ad.innerHTML=`<button class="b" data-a="pe" data-i="0">+ Add product</button><div class="tw"><table><tr><th>Photo</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${PR.map(p=>`<tr><td><div style="width:64px">${pic(p)}</div></td><td>${esc(p.name)}<br><small>${p.colors.length} colour(s)</small></td><td>${esc(p.cat)}</td><td>${inr(p.price)}</td><td>${p.stock}</td><td><button class="b g" data-a="pe" data-i="${p.id}">Edit</button> <button class="b g" data-a="pd" data-i="${p.id}">Delete</button></td></tr>`).join("")}</table></div>`;
else if(tab=="o")ad.innerHTML=`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total / payment</th><th>Status</th></tr>${ORD.map(o=>`<tr><td>#${o.id}<br><small>${new Date(o.created).toLocaleDateString("en-IN")}</small></td><td>${esc(o.name)}<br>${esc(o.mobile)}<br><small>${esc(o.address)}</small></td><td>${o.items.map(i=>esc(i.n)+(i.c?" ("+esc(i.c)+")":"")+" × "+i.q).join("<br>")}</td><td>${inr(o.total)}<br><small>${esc(o.payment)}${o.txn?"<br>Txn: "+esc(o.txn):""}</small></td><td><select data-o="${o.id}">${["Placed","Packed","Shipped","Delivered","Cancelled"].map(s=>`<option${s==o.status?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||'<tr><td colspan="5">No orders yet.</td></tr>'}</table></div>`;
else if(tab=="r")ad.innerHTML=`<div class="tw"><table><tr><th>Product</th><th>Customer</th><th>Rating</th><th>Feedback</th><th></th></tr>${RVW.map(r=>`<tr><td>${esc(r.product)}</td><td>${esc(r.name)}<br><small>${esc(r.mobile)}</small></td><td><span class="star">${stars(r.rating)}</span></td><td>${esc(r.text)}${r.img?`<img src="${esc(r.img)}" alt="" style="max-width:100px;display:block;margin-top:6px;border-radius:8px">`:""}</td><td><button class="b g" data-a="rd" data-i="${r.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="5">No reviews yet.</td></tr>'}</table></div>`;
else{qrTmp="";const sp=SET.support||[];ad.innerHTML=`<div class="card"><div class="pad"><label>Your UPI ID</label><input id="su1" value="${esc(SET.upi)}" placeholder="shop@upi"><label>Payment QR image (PNG/JPG, under 200 KB)</label><input id="sq" type="file" accept="image/png,image/jpeg,image/webp">${SET.qr?`<img src="${esc(SET.qr)}" alt="QR" style="max-width:140px;margin-top:8px">`:""}<label>Customer service numbers (customers see Call / WhatsApp / SMS buttons)</label>${[0,1,2].map(k=>`<div class="cr"><input id="sl${k}" placeholder="Name, e.g. Sales" value="${esc((sp[k]||{}).label||"")}"><input id="sn${k}" inputmode="tel" placeholder="Phone number" value="${esc((sp[k]||{}).phone||"")}"></div>`).join("")}<label>New admin password (optional, 8+ characters)</label><input id="sp" type="password" autocomplete="new-password"><p style="margin-top:12px"><button class="b" data-a="ss">Save settings</button></p></div></div>`;
$("#sq").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e5){toast("Image too large");e.target.value="";return}const r=new FileReader;r.onload=()=>qrTmp=r.result;r.readAsDataURL(f)}}}
function clRows(){$("#cl").innerHTML=CL.map((c,k)=>`<div class="cr"><input data-r="${k}" data-f="n" value="${esc(c.n)}" placeholder="Colour name"><input type="color" data-r="${k}" data-f="h" value="${esc(c.h)}"><button class="b g" data-a="clr" data-i="${k}" type="button">✕</button></div>`).join("")}
function prodForm(){imgTmp=undefined;const p=eid?P(eid):{name:"",cat:"Eyeglasses",price:"",stock:10,shape:"round",color:"#0f766e",desc:""},o=(a,v)=>a.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("");
modal(`<h2>${eid?"Edit":"Add"} product</h2><label>Name</label><input id="pn" value="${esc(p.name)}"><label>Category</label><select id="pc">${o(CATS.slice(1),p.cat)}</select><label>Price (₹)</label><input id="pp" type="number" min="1" value="${p.price}"><label>Stock</label><input id="ps" type="number" min="0" value="${p.stock}"><label>Frame shape</label><select id="psh">${o(["round","rect","cat","avi"],p.shape)}</select><label>Colour options of this model (first one is the default)</label><div id="cl"></div><button class="b g" data-a="cla" type="button">+ Add colour</button><label>Description</label><input id="pd" value="${esc(p.desc)}"><label>Product photo (optional)</label><input id="pimg" type="file" accept="image/*"><div id="pprev" style="margin:8px 0">${p.img?`<img src="${esc(p.img)}" alt="" style="max-width:160px;border-radius:8px">`:""}</div>${p.img?'<button class="b g" data-a="rmimg" type="button">Remove photo</button>':""}<p id="er" class="err"></p><button class="b x" data-a="psv">Save</button><button class="b g x" data-a="x">Cancel</button>`);CL=p.colors?p.colors.map(c=>({...c})):[{n:"Standard",h:p.color}];clRows()}
const pvTop=p=>`<div class="img">${pic(p,col(p).h)}</div><p class="mut">${esc(p.desc)}</p>${p.colors.length>1?`<small>Colour: <b>${esc(col(p).n)}</b></small>`:""}${sws(p)}<div class="row"><b>${inr(p.price)}</b>${p.stock>0?`<button class="b" data-a="add" data-i="${p.id}">Add to cart</button>`:'<span class="mut">Out of stock</span>'}</div>`;
function revForm(p){if(!S||S.role!="user")return '<p class="mut"><a href="#" data-a="login">Login</a> to review products you have received.</p>';
if(!RV.canReview)return '<p class="mut">You can review this product after your order has been delivered.</p>';
const m=RV.mine||{rating:5,text:""};
return `<h3>${RV.mine?"Update your review":"Write a review"}</h3><label>Rating</label><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}"${n==m.rating?" selected":""}>${"★".repeat(n)}${"☆".repeat(5-n)} (${n})</option>`).join("")}</select><label>Your feedback</label><textarea id="rt" rows="3" maxlength="500">${esc(m.text)}</textarea><label>Photo of the delivered product (optional)</label><input id="rimg" type="file" accept="image/*"><div id="rprev" style="margin:8px 0">${m.img?`<img src="${esc(m.img)}" alt="" style="max-width:140px;border-radius:8px">`:""}</div><p id="er" class="err"></p><button class="b x" data-a="rs">${RV.mine?"Update":"Submit"} review</button>${RV.mine?'<button class="b g x" data-a="rdl">Delete my review</button>':""}`}
function prodM(){const p=P(pvid);if(!p)return cls();
modal(`<h2>${esc(p.name)}</h2><div id="pvtop">${pvTop(p)}</div><h3>Reviews${p.rc?` · <span class="star">${stars(p.rating)}</span> ${p.rating} (${p.rc})`:""}</h3>${RV.reviews.map(r=>`<div class="rv"><span class="star">${stars(r.rating)}</span> <b>${esc(r.name)}</b> <small>${new Date(r.created).toLocaleDateString("en-IN")}</small>${r.text?`<p>${esc(r.text)}</p>`:""}${r.img?`<img src="${esc(r.img)}" alt="Customer photo">`:""}</div>`).join("")||'<p class="mut">No reviews yet.</p>'}${revForm(p)}<button class="b g x" data-a="x">Close</button>`)}
const run=async(f,onErr)=>{try{await f()}catch(e){(onErr||toast)(e.message)}};
const A={
cla(){if(CL.length<8)CL.push({n:"",h:"#000000"});clRows()},clr(i){CL.splice(+i,1);if(!CL.length)CL.push({n:"Standard",h:"#0f766e"});clRows()},
sc(v){const[id,k]=v.split(":");SEL[id]=+k;grid();const t=$("#pvtop");if(t&&pvid==id)t.innerHTML=pvTop(P(id))},
pv(i){run(async()=>{pvid=+i;RV=await api("GET","/products/"+i+"/reviews");rvImg=undefined;prodM()})},
rs(){run(async()=>{const b={rating:+$("#rr").value,text:$("#rt").value};if(rvImg!==undefined)b.image=rvImg;await api("POST","/products/"+pvid+"/reviews",b);await load();RV=await api("GET","/products/"+pvid+"/reviews");rvImg=undefined;prodM();toast("Thank you for your review!")},err)},
rdl(){if(!confirm("Delete your review?"))return;run(async()=>{await api("DELETE","/products/"+pvid+"/reviews");await load();RV=await api("GET","/products/"+pvid+"/reviews");prodM();grid()})},
rd(i){if(!confirm("Delete this review?"))return;run(async()=>{await api("DELETE","/admin/reviews/"+i);await load();await admin()})},
help(){modal(`<h2>Customer service</h2>${(SET.support||[]).map(s=>`<div class="card" style="margin-bottom:10px"><div class="pad"><b>${esc(s.label)}</b><br><span class="mut">${esc(s.phone)}</span><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><a class="b" href="tel:+${wa(s.phone)}">📞 Call</a><a class="b g" href="https://wa.me/${wa(s.phone)}?text=${encodeURIComponent("Hello ClearView Opticals, I need help.")}" target="_blank" rel="noopener">💬 WhatsApp</a><a class="b g" href="sms:+${wa(s.phone)}">✉️ SMS</a></div></div></div>`).join("")}<button class="b g x" data-a="x">Close</button>`)},
add(i){const p=P(i),co=col(p).n,c=cart.find(x=>x.id==p.id&&x.c==co);if(cart.filter(x=>x.id==p.id).reduce((s,x)=>s+x.q,0)>=p.stock)return toast("No more stock");c?c.q++:cart.push({id:p.id,q:1,c:co});nav();toast("Added to cart")},
cat(i){cat=i;shop()},cartv(){cartM()},
inc(i){const c=cart[i];if(cart.filter(x=>x.id==c.id).reduce((s,x)=>s+x.q,0)<P(c.id).stock)c.q++;else toast("No more stock");cartM();nav()},
dec(i){const c=cart[i];c.q--;if(c.q<1)cart.splice(i,1);cartM();nav()},
x:cls,rmimg(){imgTmp="";$("#pprev").innerHTML="<small>Photo will be removed when you save</small>"},login(){nx=0;loginM()},li(){loginM()},lu(){loginM("up")},
co(){if(!S||S.role!="user"){nx=1;loginM();return}checkout()},
si(){run(async()=>A.done(await api("POST","/login",{mobile:$("#lm").value.trim(),password:$("#lp").value})),err)},
su(){run(async()=>A.done(await api("POST","/signup",{name:$("#ln").value.trim(),mobile:$("#lm").value.trim(),password:$("#lp").value})),err)},
done(u){S=u;cls();nav();toast("Welcome, "+u.name+"!");if(nx){nx=0;checkout()}},
out(){run(async()=>{await api("POST","/logout");S=null;cart=[];location.hash="shop";render()})},
adm(){if(S&&S.role=="admin")location.hash="admin";else adminLogin()},
al(){run(async()=>{S=await api("POST","/admin/login",{username:$("#au").value.trim(),password:$("#ap").value});if(location.hash=="#admin")render();else location.hash="admin"},err)},
tab(i){tab=i;run(admin)},pe(i){eid=+i;prodForm()},
pd(i){eid=+i;modal(`<h2>Delete “${esc(P(i).name)}”?</h2><p>This removes it from the shop.</p><button class="b x" data-a="pdy">Yes, delete</button><button class="b g x" data-a="x">Cancel</button>`)},
pdy(){run(async()=>{await api("DELETE","/admin/products/"+eid);await load();cls();await admin()})},
psv(){run(async()=>{await api(eid?"PUT":"POST","/admin/products"+(eid?"/"+eid:""),{name:$("#pn").value,cat:$("#pc").value,price:$("#pp").value,stock:$("#ps").value,shape:$("#psh").value,color:CL[0].h,colors:CL,desc:$("#pd").value,image:imgTmp});await load();cls();await admin()},err)},
ss(){run(async()=>{const b={upi:$("#su1").value,support:[0,1,2].map(k=>({label:$("#sl"+k).value,phone:$("#sn"+k).value})).filter(x=>x.phone.trim())};if(qrTmp)b.qr=qrTmp;if($("#sp").value)b.newPassword=$("#sp").value;await api("PUT","/admin/settings",b);await load();toast("Settings saved");await admin()})},

cart=[];nav();await load();modal(`<div class="cheer">${GIRL}</div><h2 style="text-align:center">Order placed 🎉</h2><p>Your order <b>#${esc(r.id)}</b> is confirmed. We will deliver it to your address soon.</p><a class="b" href="#orders">View my orders</a>`)},err)}};
document.addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(a){e.preventDefault();A[a.dataset.a]&&A[a.dataset.a](a.dataset.i)}else if(e.target.id=="m")cls()});

addEventListener("hashchange",render);init();
</script></body></html>
